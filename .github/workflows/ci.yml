name: ci

on:
  push:
  pull_request:

env:
  UV_PYTHON: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --locked pytest -v
      - run: uv run --locked ruff check .
      - run: uv run --locked python -m kcommon.ste_lint README.md $(git ls-files 'skills/*.md')
